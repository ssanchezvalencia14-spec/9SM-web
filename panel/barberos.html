<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9SM — Barberos</title>
  <link rel="stylesheet" href="../css/panel.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="panel-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__logo">9<span>SM</span></div>
      <button class="sidebar__close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar__nav">
      <a href="dashboard.html" class="sidebar__link"><span class="sidebar__icon">📊</span> Dashboard</a>
      <a href="citas.html" class="sidebar__link"><span class="sidebar__icon">📅</span> Citas</a>
      <a href="clientes.html" class="sidebar__link"><span class="sidebar__icon">👥</span> Clientes</a>
      <a href="servicios.html" class="sidebar__link"><span class="sidebar__icon">✂️</span> Servicios</a>
      <a href="barberos.html" class="sidebar__link sidebar__link--active"><span class="sidebar__icon">💈</span> Barberos</a>
    </nav>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__avatar" id="sidebarAvatar">SM</div>
        <div>
          <p class="sidebar__uname" id="sidebarName">Samuel M.</p>
          <p class="sidebar__urole" id="sidebarRole">Barbero Principal</p>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="panel-main">
    <header class="topbar">
      <button class="topbar__menu" id="menuBtn">☰</button>
      <div class="topbar__title">Equipo de Barberos</div>
      <div class="topbar__right">
        <span class="topbar__date" id="topbarDate"></span>
        <a href="../index.html" class="topbar__site" target="_blank">🌐 Ver web</a>
      </div>
    </header>

    <div class="panel-content">

      <div class="page-actions">
        <div class="page-actions__left"></div>
        <button class="btn btn--gold" id="newBarberBtn">+ Añadir Barbero</button>
      </div>

      <div class="barbers-admin-grid" id="barbersGrid"></div>

    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal__header">
        <h3 id="modalTitle">Nuevo Barbero</h3>
        <button class="modal__close" id="modalClose">✕</button>
      </div>
      <form class="modal__form" id="barberForm">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="bName" placeholder="Nombre" required />
          </div>
          <div class="form-group">
            <label>Rol / Cargo</label>
            <input type="text" id="bRole" placeholder="Barbero Senior" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="bPhone" placeholder="+34 600 000 000" />
          </div>
          <div class="form-group">
            <label>Años experiencia</label>
            <input type="number" id="bYears" placeholder="5" min="0" />
          </div>
        </div>
        <div class="form-group">
          <label>Especialidades (separadas por coma)</label>
          <input type="text" id="bSpecialties" placeholder="Fade, Barba, Diseños" />
        </div>
        <div class="form-group">
          <label>Usuario de acceso</label>
          <input type="text" id="bUsername" placeholder="usuario123" />
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--outline" id="modalCancelBtn">Cancelar</button>
          <button type="submit" class="btn btn--gold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/panel.js"></script>
  <script>
    let barbers = JSON.parse(localStorage.getItem('9sm_barbers') || 'null') || [
      { id:1, name:'Samuel M.',    role:'Barbero Principal · Fundador', phone:'600001000', years:8, specialties:['Fade','Diseños','Clásico'], username:'samuel', citasSemana:24, ingresosSemana:480 },
      { id:2, name:'Carlos R.',    role:'Barbero Senior',               phone:'600001001', years:5, specialties:['Barba','Navaja','Color'],   username:'carlos',  citasSemana:18, ingresosSemana:350 },
      { id:3, name:'Alejandro L.', role:'Barbero Estilista',            phone:'600001002', years:3, specialties:['Mechas','Moderno','Color'], username:'alejandro', citasSemana:15, ingresosSemana:420 },
    ];

    let editId = null;
    function save() { localStorage.setItem('9sm_barbers', JSON.stringify(barbers)); }

    function initials(name) {
      return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    }

    function render() {
      const grid = document.getElementById('barbersGrid');
      if (!grid) return;
      grid.innerHTML = barbers.map(b => `
        <div class="barber-admin-card">
          <div class="barber-admin-card__actions">
            <button class="tbl-btn tbl-btn--edit" onclick="editBarber(${b.id})">✏️</button>
            <button class="tbl-btn tbl-btn--del"  onclick="deleteBarber(${b.id})">🗑️</button>
          </div>
          <div class="barber-admin-avatar">${initials(b.name)}</div>
          <h3>${b.name}</h3>
          <p class="barber-admin-role">${b.role}</p>
          <p class="barber-admin-phone">📞 ${b.phone}</p>
          <div class="barber-admin-tags">
            ${b.specialties.map(s=>`<span>${s}</span>`).join('')}
          </div>
          <div class="barber-admin-stats">
            <div class="barber-stat">
              <span class="barber-stat__val">${b.years}</span>
              <span class="barber-stat__lbl">años exp.</span>
            </div>
            <div class="barber-stat">
              <span class="barber-stat__val">${b.citasSemana}</span>
              <span class="barber-stat__lbl">citas/sem</span>
            </div>
            <div class="barber-stat">
              <span class="barber-stat__val">${b.ingresosSemana}€</span>
              <span class="barber-stat__lbl">ing./sem</span>
            </div>
          </div>
          <div class="barber-admin-login">
            <span>👤 Usuario: <strong>${b.username}</strong></span>
          </div>
        </div>
      `).join('');
    }

    function openModal(reset=true) {
      document.getElementById('modalOverlay').style.display = 'flex';
      if (reset) {
        document.getElementById('barberForm').reset();
        document.getElementById('modalTitle').textContent = 'Nuevo Barbero';
        editId = null;
      }
    }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; editId = null; }

    function editBarber(id) {
      const b = barbers.find(x=>x.id===id);
      if (!b) return;
      editId = id;
      document.getElementById('bName').value = b.name;
      document.getElementById('bRole').value = b.role;
      document.getElementById('bPhone').value = b.phone;
      document.getElementById('bYears').value = b.years;
      document.getElementById('bSpecialties').value = b.specialties.join(', ');
      document.getElementById('bUsername').value = b.username;
      document.getElementById('modalTitle').textContent = 'Editar Barbero';
      openModal(false);
    }

    function deleteBarber(id) {
      if (!confirm('¿Eliminar este barbero?')) return;
      barbers = barbers.filter(b=>b.id!==id);
      save(); render();
    }

    document.getElementById('newBarberBtn')?.addEventListener('click', () => openModal());
    document.getElementById('modalClose')?.addEventListener('click', closeModal);
    document.getElementById('modalCancelBtn')?.addEventListener('click', closeModal);
    document.getElementById('modalOverlay')?.addEventListener('click', e => {
      if (e.target===document.getElementById('modalOverlay')) closeModal();
    });

    document.getElementById('barberForm')?.addEventListener('submit', e => {
      e.preventDefault();
      const data = {
        id: editId || (Math.max(0,...barbers.map(b=>b.id))+1),
        name: document.getElementById('bName').value.trim(),
        role: document.getElementById('bRole').value.trim(),
        phone: document.getElementById('bPhone').value.trim(),
        years: +document.getElementById('bYears').value || 0,
        specialties: document.getElementById('bSpecialties').value.split(',').map(s=>s.trim()).filter(Boolean),
        username: document.getElementById('bUsername').value.trim(),
        citasSemana: editId ? barbers.find(b=>b.id===editId).citasSemana : 0,
        ingresosSemana: editId ? barbers.find(b=>b.id===editId).ingresosSemana : 0,
      };
      if (editId) { barbers = barbers.map(b=>b.id===editId?data:b); }
      else { barbers.push(data); }
      save(); render(); closeModal();
    });

    render();
  </script>
</body>
</html>
