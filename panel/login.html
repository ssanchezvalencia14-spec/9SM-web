<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9SM — Panel de Barberos</title>
  <link rel="stylesheet" href="../css/panel.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-logo">9<span>SM</span></div>
      <h1>Panel de Barberos</h1>
      <p>Gestiona tus citas, clientes y servicios</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <div class="input-icon">
          <span class="input-icon__icon">👤</span>
          <input type="text" placeholder="Tu usuario" id="loginUser" required autocomplete="username" />
        </div>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-icon">
          <span class="input-icon__icon">🔒</span>
          <input type="password" placeholder="••••••••" id="loginPass" required autocomplete="current-password" />
        </div>
      </div>

      <div class="login-hint">
        <span>Demo: usuario <strong>samuel</strong> / contraseña <strong>9sm2024</strong></span>
      </div>

      <div class="login-error" id="loginError" style="display:none;">
        Usuario o contraseña incorrectos
      </div>

      <button type="submit" class="btn btn--gold btn--full">Iniciar Sesión</button>
    </form>

    <a href="../index.html" class="login-back">← Volver al sitio web</a>
  </div>

  <div class="login-bg">
    <div class="login-bg__pattern"></div>
  </div>

  <script>
    const USERS = {
      samuel: { pass: '9sm2024', name: 'Samuel M.', role: 'Barbero Principal' },
      carlos: { pass: 'carlos123', name: 'Carlos R.', role: 'Barbero Senior' },
      alejandro: { pass: 'ale123', name: 'Alejandro L.', role: 'Barbero Estilista' },
      admin: { pass: 'admin9sm', name: 'Administrador', role: 'Admin' }
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.toLowerCase().trim();
      const pass = document.getElementById('loginPass').value;
      const error = document.getElementById('loginError');

      if (USERS[user] && USERS[user].pass === pass) {
        sessionStorage.setItem('9sm_user', JSON.stringify({ username: user, ...USERS[user] }));
        window.location.href = 'dashboard.html';
      } else {
        error.style.display = 'block';
        setTimeout(() => error.style.display = 'none', 3000);
      }
    });
  </script>
</body>
</html>
