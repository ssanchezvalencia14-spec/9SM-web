<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9SM — Gestión de Citas</title>
  <link rel="stylesheet" href="../css/panel.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="panel-page">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__logo">9<span>SM</span></div>
      <button class="sidebar__close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar__nav">
      <a href="dashboard.html" class="sidebar__link"><span class="sidebar__icon">📊</span> Dashboard</a>
      <a href="citas.html" class="sidebar__link sidebar__link--active"><span class="sidebar__icon">📅</span> Citas</a>
      <a href="clientes.html" class="sidebar__link"><span class="sidebar__icon">👥</span> Clientes</a>
      <a href="servicios.html" class="sidebar__link"><span class="sidebar__icon">✂️</span> Servicios</a>
      <a href="barberos.html" class="sidebar__link"><span class="sidebar__icon">💈</span> Barberos</a>
    </nav>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__avatar" id="sidebarAvatar">SM</div>
        <div>
          <p class="sidebar__uname" id="sidebarName">Samuel M.</p>
          <p class="sidebar__urole" id="sidebarRole">Barbero Principal</p>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <div class="panel-main">
    <header class="topbar">
      <button class="topbar__menu" id="menuBtn">☰</button>
      <div class="topbar__title">Gestión de Citas</div>
      <div class="topbar__right">
        <span class="topbar__date" id="topbarDate"></span>
        <a href="../index.html" class="topbar__site" target="_blank">🌐 Ver web</a>
      </div>
    </header>

    <div class="panel-content">

      <!-- ACTIONS -->
      <div class="page-actions">
        <div class="page-actions__left">
          <input type="text" class="search-input" placeholder="🔍 Buscar cliente o servicio..." id="searchInput" />
          <select class="filter-select" id="filterStatus">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendientes</option>
            <option value="completado">Completados</option>
            <option value="cancelado">Cancelados</option>
          </select>
          <input type="date" class="filter-select" id="filterDate" />
        </div>
        <button class="btn btn--gold" id="newApptBtn">+ Nueva Cita</button>
      </div>

      <!-- TABLE -->
      <div class="panel-card">
        <div class="panel-card__header">
          <h3>Todas las Citas</h3>
          <span class="badge-count" id="apptCount">12 citas</span>
        </div>
        <table class="panel-table" id="citasTable">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Servicio</th>
              <th>Barbero</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Precio</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="citasBody">
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal__header">
        <h3 id="modalTitle">Nueva Cita</h3>
        <button class="modal__close" id="modalClose">✕</button>
      </div>
      <form class="modal__form" id="apptForm">
        <div class="form-row">
          <div class="form-group">
            <label>Nombre del cliente</label>
            <input type="text" id="fName" placeholder="Nombre completo" required />
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="fPhone" placeholder="+34 600 000 000" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Servicio</label>
            <select id="fService" required>
              <option value="">Seleccionar servicio</option>
              <option value="Corte Clásico">Corte Clásico — 15€</option>
              <option value="Corte + Barba">Corte + Barba — 25€</option>
              <option value="Afeitado Real">Afeitado Real — 20€</option>
              <option value="Color & Mechas">Color & Mechas — 30€</option>
              <option value="Tratamiento Capilar">Tratamiento Capilar — 20€</option>
              <option value="Pack VIP">Pack VIP — 50€</option>
            </select>
          </div>
          <div class="form-group">
            <label>Barbero</label>
            <select id="fBarber">
              <option value="Samuel M.">Samuel M.</option>
              <option value="Carlos R.">Carlos R.</option>
              <option value="Alejandro L.">Alejandro L.</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fDate" required />
          </div>
          <div class="form-group">
            <label>Hora</label>
            <select id="fTime" required>
              <option value="">Seleccionar hora</option>
              <option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option>
              <option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option>
              <option>16:00</option><option>16:30</option><option>17:00</option><option>17:30</option>
              <option>18:00</option><option>18:30</option><option>19:00</option><option>19:30</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="fStatus">
            <option value="pendiente">Pendiente</option>
            <option value="completado">Completado</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--outline" id="modalCancelBtn">Cancelar</button>
          <button type="submit" class="btn btn--gold" id="modalSaveBtn">Guardar Cita</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/panel.js"></script>
  <script src="../js/citas.js"></script>
</body>
</html>
